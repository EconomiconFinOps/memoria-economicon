name: Memoria PDF

"on":
  pull_request:
    branches: [main]
    paths:
      - 'main.tex'
      - 'economicon.cls'
      - 'referencias.bib'
      - 'capitulos/**'
      - 'figuras/**'
      - 'fuentes/**'
      - 'VERSION'
      - '.github/workflows/memoria.yml'
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'economicon.cls'
      - 'referencias.bib'
      - 'capitulos/**'
      - 'figuras/**'
      - 'fuentes/**'
      - 'VERSION'
      - '.github/workflows/memoria.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar con LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
      - name: Nombrar el PDF y resumir
        run: |
          mv main.pdf Economicon_Memoria_TFM.pdf
          echo "Marcas pendientes: $(grep -o 'pendiente{' -r capitulos | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "Paginas: $(pdfinfo Economicon_Memoria_TFM.pdf 2>/dev/null | awk '/Pages/{print $2}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Subir el PDF para revisar el PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Economicon_Memoria_TFM
          path: Economicon_Memoria_TFM.pdf

  publicar:
    name: Guardar PDF versionado en el repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compilar con LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
      - name: Copiar el PDF con la versión de VERSION
        id: version
        run: |
          mv main.pdf Economicon_Memoria_TFM.pdf
          version="$(tr -d '[:space:]' < VERSION)"
          destino="entregas/Economicon_Memoria_TFM_v${version}.pdf"
          if [ -e "$destino" ]; then
            echo "Ya existe $destino: sube el número en VERSION para generar una nueva versión." >> "$GITHUB_STEP_SUMMARY"
            echo "nueva=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p entregas
          cp Economicon_Memoria_TFM.pdf "$destino"
          echo "destino=$destino" >> "$GITHUB_OUTPUT"
          echo "nueva=true" >> "$GITHUB_OUTPUT"
      - name: Commit y push a main
        if: steps.version.outputs.nueva == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.version.outputs.destino }}"
          git commit -m "docs: PDF de la memoria $(basename "${{ steps.version.outputs.destino }}" .pdf) [skip ci]"
          git push origin HEAD:main
