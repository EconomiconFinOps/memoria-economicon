name: Memoria PDF

"on":
  pull_request:
    branches: [main]
    paths:
      - 'main.tex'
      - 'economicon.cls'
      - 'referencias.bib'
      - 'capitulos/**'
      - 'figuras/**'
      - 'fuentes/**'
      - '.github/workflows/memoria.yml'
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'economicon.cls'
      - 'referencias.bib'
      - 'capitulos/**'
      - 'figuras/**'
      - 'fuentes/**'
      - '.github/workflows/memoria.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memoria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compilar con LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          work_in_root_file_dir: true
      - name: Avisar si hay marcas pendientes y contar paginas
        run: |
          echo "Marcas pendientes: $(grep -o 'pendiente{' -r capitulos | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "Paginas: $(pdfinfo main.pdf 2>/dev/null | awk '/Pages/{print $2}')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-economicon-pdf
          path: main.pdf
